apiVersion: gridalyn.io/v1alpha1
kind: StudyProject
metadata:
  name: prosumer_battery_market
  version: 0.1.0
  description: Small synthetic feeder with distributed prosumers, batteries, and a real-time local market.
spec:
  pathBase: project
  inputs:
    sourceNetwork:
      name: Synthetic 14-bus radial distribution feeder
      provider: gridalyn project script
      note: Deterministic compact feeder generated locally for reproducible prosumer market experiments.
    market:
      intervalMinutes: 5
      intervalCount: 12
      participantCount: 5
      product: battery discharge to reduce feeder import above a real-time operating limit
  artifacts:
    project:
      data: outputs/data
      figures: outputs/figures
      manifests: outputs/manifests
      operations: outputs/operations
      reports: outputs/reports
  workflow:
    file: workflow.yaml
  validation:
    requiredReports:
      - outputs/reports/synthetic_feeder_report.json
      - outputs/reports/prosumer_realtime_market_report.json
    requiredFigures:
      - outputs/figures/synthetic_feeder_voltage_profile.png
      - outputs/figures/prosumer_market_dispatch.png
