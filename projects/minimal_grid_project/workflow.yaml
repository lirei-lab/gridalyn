apiVersion: gridalyn.io/v1alpha1
kind: Workflow
metadata:
  name: minimal_grid_project_workflow
spec:
  stages:
    - id: prepare_workspace
      command: python -c "from pathlib import Path; [Path(p).mkdir(parents=True, exist_ok=True) for p in ('outputs/data', 'outputs/figures', 'outputs/manifests', 'outputs/operations', 'outputs/reports', 'outputs/cache')]"
      outputs:
        - outputs/data
        - outputs/figures
        - outputs/manifests
        - outputs/operations
        - outputs/reports
    - id: run_minimal_powerflow
      needs:
        - prepare_workspace
      command: python scripts/run_minimal_powerflow.py
      outputs:
        - outputs/data/buses.csv
        - outputs/data/lines.csv
        - outputs/data/loads.csv
        - outputs/reports/minimal_grid_report.json
        - outputs/figures/minimal_voltage_profile.png
