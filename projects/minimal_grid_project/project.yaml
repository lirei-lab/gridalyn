apiVersion: gridalyn.io/v1alpha1
kind: StudyProject
metadata:
  name: minimal_grid_project
  version: 0.1.0
  description: Minimal Gridalyn project that teaches the project contract with one tiny power-flow run.
spec:
  pathBase: project
  problem:
    type: powerflow_validation
    dataset: five_bus_teaching_feeder
    environment: pandapower_powerflow
    objective: Validate the smallest reproducible Gridalyn project contract with one AC power-flow run.
    model:
      type: simulation_model
      name: pandapower
    scenarios:
      - id: baseline
        role: deterministic_baseline
        description: Five-bus feeder with fixed loads and no controllable devices.
  experiments:
    - id: baseline_powerflow
      scenario: baseline
      objective: Confirm convergence, voltage range, and report/figure generation.
      metrics:
        - powerflow_converged
        - min_voltage_pu
        - bus_count
      model: pandapower
      artifacts:
        - outputs/reports/minimal_grid_report.json
        - outputs/figures/minimal_voltage_profile.png
  inputs:
    loadGeneration:
      generator: parametric
      nUnits: 20
      seed: 7
      day: peak
      resolutionMinutes: 60
      weather: synthetic
    sourceNetwork:
      name: Five-bus radial teaching feeder
      provider: project.yaml
      note: >-
        Declarative radial feeder contract loaded through gridalyn.projects
        model-input helpers. loadsMw declares the per-bus magnitude anchors;
        the per-bus shares are diversified by the generated coincident-peak
        snapshot from loadGeneration.
      model:
        type: radial_feeder
        name: minimal_5_bus_radial_feeder
        busCount: 5
        snMva: 2.0
        baseVoltageKv: 12.47
        slackVmPu: 1.01
        loadsMw:
          1: 0.035
          2: 0.045
          3: 0.030
          4: 0.040
        qToPRatio: 0.25
        lineLengthKm: 0.25
        lineROhmPerKm: 0.28
        lineXOhmPerKm: 0.18
        lineCNfPerKm: 5.0
        lineMaxIKa: 0.25
        busYStep: 0.15
  artifacts:
    project:
      data: outputs/data
      figures: outputs/figures
      manifests: outputs/manifests
      operations: outputs/operations
      reports: outputs/reports
  workflow:
    file: workflow.yaml
  validation:
    requiredReports:
      - outputs/reports/minimal_grid_report.json
    requiredFigures:
      - outputs/figures/minimal_voltage_profile.png
