apiVersion: gridalyn.io/v1alpha1
kind: StudyProject
metadata:
  name: rl_voltage_control_lightsim
  version: 0.1.0
  description: Tabular RL voltage-control demo using lightsim2grid for fast power-flow simulation.
spec:
  pathBase: project
  problem:
    type: learning_voltage_control
    dataset: synthetic_rl_voltage_feeder
    environment: lightsim2grid_voltage_control
    objective: Train and evaluate a compact control policy that reduces voltage deviations with PV and battery actions.
    model:
      type: control_model
      name: tabular_q_learning
    scenarios:
      - id: training
        role: policy_training_case
        description: Repeated episodes over the deterministic feeder environment.
      - id: evaluation
        role: policy_evaluation_case
        description: Fixed evaluation run used for public reports and figures.
  experiments:
    - id: train_and_evaluate_policy
      scenarios:
        - training
        - evaluation
      objective: Verify that the learned policy improves the voltage-control reward in evaluation.
      metrics:
        - mean_reward
        - voltage_violation_count
        - episode_count
      model: tabular_q_learning
      artifacts:
        - outputs/reports/rl_feeder_report.json
        - outputs/reports/rl_voltage_control_report.json
  inputs:
    sourceNetwork:
      name: Synthetic 10-bus feeder for RL control
      provider: gridalyn project script
      note: Deterministic radial feeder with PV and controllable battery load/injection.
    learning:
      algorithm: gridalyn tabular voltage-control trainer
      simulator: lightsim2grid
      episodeCount: 90
      evaluationSteps: 24
  artifacts:
    project:
      data: outputs/data
      figures: outputs/figures
      manifests: outputs/manifests
      operations: outputs/operations
      reports: outputs/reports
  workflow:
    file: workflow.yaml
  validation:
    requiredReports:
      - outputs/reports/rl_feeder_report.json
      - outputs/reports/rl_voltage_control_report.json
    requiredFigures:
      - outputs/figures/rl_feeder_voltage_profile.png
      - outputs/figures/rl_voltage_control.png
