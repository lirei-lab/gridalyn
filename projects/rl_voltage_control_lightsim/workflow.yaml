apiVersion: gridalyn.io/v1alpha1
kind: Workflow
metadata:
  name: rl_voltage_control_lightsim_workflow
spec:
  stages:
    - id: prepare_workspace
      command: "{python} -m gridalyn.interfaces.cli.project prepare-workspace ."
      outputs:
        - outputs/data
        - outputs/figures
        - outputs/manifests
        - outputs/operations
        - outputs/reports
        - outputs/cache
    - id: build_rl_feeder
      needs:
        - prepare_workspace
      command: "{python} scripts/build_rl_feeder.py"
      outputs:
        - outputs/data/buses.csv
        - outputs/data/lines.csv
        - outputs/data/loads.csv
        - outputs/data/rl_assets.csv
        - outputs/reports/rl_feeder_report.json
        - outputs/figures/rl_feeder_voltage_profile.png
    - id: train_rl_voltage_agent
      needs:
        - build_rl_feeder
      command: "{python} scripts/train_rl_agent.py"
      inputs:
        - outputs/data/rl_assets.csv
      outputs:
        - outputs/data/training_episodes.csv
        - outputs/data/policy_evaluation_trajectory.csv
        - outputs/operations/q_table.csv
        - outputs/operations/learned_policy.csv
        - outputs/reports/rl_voltage_control_report.json
        - outputs/figures/rl_voltage_control.png
    - id: export_twin_network_model
      needs:
        - prepare_workspace
      command: "{python} scripts/export_twin_network_model.py"
      outputs:
        - outputs/data/twin_network_model_config.json
        - outputs/data/twin_network_model/grid_buses.parquet
        - outputs/data/twin_network_model/grid_lines.parquet
        - outputs/data/twin_network_model/grid_transformers.parquet
        - outputs/data/twin_network_model/buildings.parquet
        - outputs/data/twin_network_model/building_grid_connectivity.parquet
        - outputs/data/twin_network_model/metadata.json
        - outputs/data/twin_network_model/network_adapter_validation_report.json
        - outputs/reports/twin_network_model_report.json

    - id: validate_project_outputs
      needs:
        - export_twin_network_model
      command: "{python} -m gridalyn.interfaces.cli.project sense-check ."
      outputs:
        - outputs/reports/project_sense_check_report.json
