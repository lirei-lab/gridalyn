apiVersion: gridalyn.io/v1alpha1
kind: Workflow
metadata:
  name: admm_thermal_consensus_pipeline
  description: >-
    Synthesize cold-day heating agents, build the IEEE-33 feeder, train the
    imputation forecaster, run sharing-ADMM across the comms-failure sweep,
    validate on pandapower, then emit governed reports and paper figures.
spec:
  stages:
    - id: prepare_workspace
      command: "{python} -m gridalyn.interfaces.cli.project prepare-workspace projects/admm_thermal_consensus"
      outputs:
        - outputs/data
        - outputs/json
        - outputs/reports
        - outputs/cache
        - outputs/figures
    - id: generate_agents
      needs: [prepare_workspace]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.generate_agents"
      outputs:
        - outputs/data/agents_heating.parquet
        - outputs/data/agents_background.parquet
        - outputs/json/agent_params.json
        - outputs/reports/agents_report.json
    - id: build_network
      needs: [generate_agents]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.build_network"
      outputs:
        - outputs/json/bus_weights.json
        - outputs/json/network_scale.json
        - outputs/reports/network_report.json
    - id: export_twin_network_model
      needs: [prepare_workspace]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.export_twin_network_model"
      outputs:
        - outputs/data/twin_network_model_config.json
        - outputs/data/twin_network_model/grid_buses.parquet
        - outputs/data/twin_network_model/grid_lines.parquet
        - outputs/data/twin_network_model/grid_transformers.parquet
        - outputs/data/twin_network_model/buildings.parquet
        - outputs/data/twin_network_model/building_grid_connectivity.parquet
        - outputs/data/twin_network_model/metadata.json
        - outputs/data/twin_network_model/network_adapter_validation_report.json
        - outputs/reports/twin_network_model_report.json
    - id: train_forecaster
      needs: [generate_agents]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.train_forecaster"
      outputs:
        - outputs/cache/imputer.pkl
        - outputs/json/forecast_cv.json
        - outputs/reports/forecast_report.json
    - id: run_admm
      needs: [build_network, train_forecaster]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.run_admm"
      outputs:
        - outputs/data/aggregate_profiles.parquet
        - outputs/json/admm_convergence.json
        - outputs/json/aggregate_kpis.json
        - outputs/reports/admm_report.json
    - id: validate_powerflow
      needs: [run_admm]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.validate_powerflow"
      outputs:
        - outputs/data/network_feasibility.parquet
        - outputs/reports/powerflow_report.json
    - id: build_reports
      needs: [validate_powerflow]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.build_study_report"
      outputs:
        - outputs/json/study_results.json
        - outputs/reports/study_report.json
    - id: make_figures
      needs: [build_reports]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.make_figures"
      outputs:
        - outputs/figures
    - id: uncertainty_sweep
      needs: [run_admm, build_network]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.uncertainty_sweep"
      outputs:
        - outputs/data/uncertainty_summary.parquet
        - outputs/data/uncertainty_draws.parquet
        - outputs/json/uncertainty_results.json
        - outputs/reports/uncertainty_report.json
    - id: make_uncertainty_figure
      needs: [uncertainty_sweep]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.make_uncertainty_figure"
      outputs:
        - outputs/figures/fig_uncertainty_loading.pdf
        - outputs/figures/fig_uncertainty_loading.png
    - id: imputer_comparison
      needs: [run_admm, build_network]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.imputer_comparison"
      outputs:
        - outputs/data/imputer_comparison_curves.parquet
        - outputs/json/imputer_comparison.json
        - outputs/reports/imputer_comparison_report.json
    - id: make_comparison_figure
      needs: [imputer_comparison]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.make_comparison_figure"
      outputs:
        - outputs/figures/fig_imputer_comparison.pdf
        - outputs/figures/fig_imputer_comparison.png
    - id: comfort_validation
      needs: [generate_agents]
      command: "{python} -m projects.admm_thermal_consensus.scripts.pipeline.comfort_validation"
      outputs:
        - outputs/json/comfort_validation.json
        - outputs/reports/comfort_report.json
        - outputs/figures/fig_comfort.pdf
        - outputs/figures/fig_comfort.png
