apiVersion: gridalyn.io/v1alpha1
kind: StudyProject
metadata:
  name: der_voltage_optimization
  version: 0.1.0
  description: Small synthetic feeder with Gridalyn DER dispatch and physical voltage verification.
spec:
  simulation:
    # Declared RNG base: matches spec.inputs.loadGeneration.seed, the only RNG this study draws from.
    seed: 31
  pathBase: project
  problem:
    type: der_voltage_optimization
    dataset: synthetic_der_hosting_feeder
    environment: gridalyn_der_dispatch_with_powerflow_verification
    objective: Compute DER and battery setpoints that improve feeder voltage while respecting operating limits.
    model:
      type: optimization_model
      name: gridalyn_der_voltage_dispatch
    scenarios:
      - id: pv_voltage_stress
        role: voltage_control_case
        description: Downstream PV and battery condition used to test voltage-aware dispatch.
  experiments:
    - id: optimized_dispatch_verification
      scenario: pv_voltage_stress
      objective: Compare optimized setpoints against AC power-flow validation.
      metrics:
        - objective_value
        - min_voltage_pu
        - max_voltage_pu
      model: gridalyn_der_voltage_dispatch
      artifacts:
        - outputs/reports/der_feeder_report.json
        - outputs/reports/der_voltage_optimization_report.json
  inputs:
    loadGeneration:
      generator: parametric
      nUnits: 60
      seed: 31
      day: peak
      resolutionMinutes: 15
      weather: synthetic
    sourceNetwork:
      name: Synthetic 16-bus DER hosting feeder
      provider: project.yaml
      note: >-
        Declarative radial feeder contract loaded through gridalyn.projects
        model-input helpers. loadsMw declares the per-bus magnitude anchors;
        the per-bus shares are diversified by the generated coincident-peak
        snapshot from loadGeneration.
      model:
        type: radial_feeder
        name: synthetic_16_bus_der_feeder
        busCount: 16
        snMva: 5.0
        baseVoltageKv: 12.47
        slackVmPu: 1.02
        loadsMw:
          1: 0.04
          2: 0.05
          3: 0.05
          4: 0.06
          5: 0.04
          6: 0.05
          7: 0.05
          8: 0.04
          9: 0.04
          10: 0.05
          11: 0.04
          12: 0.05
          13: 0.04
          14: 0.04
          15: 0.04
        qToPRatio: 0.28
        lineLengthKm: 0.65
        lineLengthsKm:
          1: 0.69
          2: 0.73
          3: 0.65
          4: 0.69
          5: 0.73
          6: 0.65
          7: 0.69
          8: 0.73
          9: 0.65
          10: 0.69
          11: 0.73
          12: 0.65
          13: 0.69
          14: 0.73
          15: 0.65
        lineROhmPerKm: 0.58
        lineXOhmPerKm: 0.36
        lineCNfPerKm: 6.0
        lineMaxIKa: 0.18
        busYStep: 0.20
    derAssets:
      - id: DER01
        busId: 8
        pvAvailableMw: 0.52
        batteryChargePowerMw: 0.16
      - id: DER02
        busId: 10
        pvAvailableMw: 0.58
        batteryChargePowerMw: 0.18
      - id: DER03
        busId: 12
        pvAvailableMw: 0.56
        batteryChargePowerMw: 0.18
      - id: DER04
        busId: 14
        pvAvailableMw: 0.62
        batteryChargePowerMw: 0.20
      - id: DER05
        busId: 15
        pvAvailableMw: 0.48
        batteryChargePowerMw: 0.16
    optimization:
      solver: gridalyn_der_voltage_dispatch
      product: voltage-constrained DER hosting and battery charging dispatch
  artifacts:
    project:
      data: outputs/data
      figures: outputs/figures
      manifests: outputs/manifests
      operations: outputs/operations
      reports: outputs/reports
  workflow:
    file: workflow.yaml
  validation:
    requiredReports:
      - outputs/reports/der_feeder_report.json
      - outputs/reports/der_voltage_optimization_report.json
    requiredFigures:
      - outputs/figures/der_feeder_voltage_profile.png
      - outputs/figures/der_voltage_optimization.png
