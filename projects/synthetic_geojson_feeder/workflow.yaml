apiVersion: gridalyn.io/v1alpha1
kind: Workflow
metadata:
  name: synthetic_geojson_feeder_workflow
spec:
  stages:
    - id: prepare_workspace
      command: python -c "from pathlib import Path; [Path(p).mkdir(parents=True, exist_ok=True) for p in ('outputs/data', 'outputs/figures', 'outputs/manifests', 'outputs/operations', 'outputs/reports', 'outputs/cache')]"
      outputs:
        - outputs/data
        - outputs/figures
        - outputs/manifests
        - outputs/operations
        - outputs/reports
    - id: generate_building_footprints
      needs:
        - prepare_workspace
      command: python scripts/generate_building_footprints.py
      outputs:
        - outputs/data/building_footprints.geojson
        - outputs/reports/building_footprints_report.json
    - id: build_synthetic_feeder
      needs:
        - generate_building_footprints
      command: python scripts/build_synthetic_feeder.py
      outputs:
        - outputs/data/buses.csv
        - outputs/data/lines.csv
        - outputs/data/loads.csv
        - outputs/reports/synthetic_network_validation_report.json
        - outputs/reports/synthetic_geojson_feeder_report.json
        - outputs/figures/synthetic_feeder_topology.png
