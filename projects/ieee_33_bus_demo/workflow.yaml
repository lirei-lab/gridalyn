apiVersion: gridalyn.io/v1alpha1
kind: Workflow
metadata:
  name: ieee_33_bus_demo_workflow
spec:
  stages:
    - id: prepare_workspace
      command: python -m gridalyn.interfaces.cli.project prepare-workspace .
      outputs:
        - outputs/data
        - outputs/figures
        - outputs/manifests
        - outputs/operations
        - outputs/reports
        - outputs/cache
    - id: run_ieee33_powerflow
      needs:
        - prepare_workspace
      command: python scripts/build_ieee33_demo.py
      outputs:
        - outputs/data/buses.csv
        - outputs/data/lines.csv
        - outputs/data/loads.csv
        - outputs/reports/ieee33_powerflow_report.json
        - outputs/figures/ieee33_voltage_profile.png
    - id: generate_operational_scenarios
      needs:
        - run_ieee33_powerflow
      command: python scripts/generate_operational_scenarios.py
      outputs:
        - outputs/data/scenarios.csv
        - outputs/data/scenario_results.csv
        - outputs/reports/ieee33_scenario_comparison_report.json
        - outputs/figures/ieee33_scenario_voltage_comparison.png
    - id: run_daily_timeseries
      needs:
        - run_ieee33_powerflow
      command: python scripts/run_daily_timeseries.py
      outputs:
        - outputs/data/daily_bus_load_profiles.csv
        - outputs/data/daily_timeseries_results.csv
        - outputs/reports/ieee33_daily_timeseries_report.json
        - outputs/figures/ieee33_daily_voltage_envelope.png
