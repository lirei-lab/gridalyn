apiVersion: gridalyn.io/v1alpha1
kind: StudyProject
metadata:
  name: ieee_33_bus_demo
  version: 0.1.0
  description: Demo project using Gridalyn's IEEE 33-bus benchmark feeder contract.
spec:
  pathBase: project
  simulation:
    # Declared RNG base: matches spec.inputs.loadGeneration.seed, the only RNG this study draws from.
    seed: 5
    # Declared, not inherited: the timeseries stage resolves this ID through
    # script.powerflow_backend() rather than calling runpp itself, so what the
    # manifest records is what the stage solved with.
    powerflowBackend: pandapower_native
  problem:
    type: benchmark_powerflow_scenarios
    dataset: ieee_33_bus_benchmark
    environment: gridalyn_powerflow
    objective: Compare deterministic operating scenarios on a known radial benchmark feeder.
    model:
      type: simulation_model
      name: gridalyn_ieee_33_bus_benchmark
    scenarios:
      - id: baseline
        role: benchmark_base_case
        description: Original IEEE 33-bus feeder.
      - id: load_growth_20
        role: demand_growth_case
        description: Uniform 20 percent demand growth.
        parameters:
          loadMultiplier: 1.2
      - id: pv_midday
        role: distributed_generation_case
        description: Midday distributed PV at selected downstream buses.
        parameters:
          pvBuses: [6, 14, 24, 30]
          pvMwPerBus: 0.25
      - id: ev_evening_peak
        role: electrification_stress_case
        description: Evening EV charging demand at selected downstream buses.
        parameters:
          evBuses: [17, 18, 25, 30, 32]
          evMwPerBus: 0.18
      - id: pv_plus_ev
        role: mixed_der_case
        description: Combined PV and EV condition for a mixed operating case.
        parameters:
          pvBuses: [6, 14, 24, 30]
          pvMwPerBus: 0.18
          evBuses: [17, 18, 25, 30, 32]
          evMwPerBus: 0.12
  experiments:
    - id: deterministic_scenario_comparison
      scenarios:
        - baseline
        - load_growth_20
        - pv_midday
        - ev_evening_peak
        - pv_plus_ev
      objective: Rank benchmark operating cases by voltage and loading impact.
      metrics:
        - min_voltage_pu
        - voltage_violation_count
        - max_line_loading_percent
      model: gridalyn_ieee_33_bus_benchmark
      artifacts:
        - outputs/reports/ieee33_powerflow_report.json
        - outputs/reports/ieee33_scenario_comparison_report.json
  inputs:
    sourceNetwork:
      name: IEEE 33-bus distribution feeder demo
      provider: gridalyn.assets.modeling.IEEE_33_BUS_BENCHMARK
      note: Gridalyn wraps the common Baran-Wu 33-bus radial distribution benchmark as a platform model contract.
    loadGeneration:
      generator: parametric
      nUnits: 32
      seed: 5
      day: peak
      resolutionMinutes: 60
      weather: synthetic
  artifacts:
    project:
      data: outputs/data
      figures: outputs/figures
      manifests: outputs/manifests
      operations: outputs/operations
      reports: outputs/reports
  # This study's scenarios, declared so the dashboard can enumerate and read
  # them without knowing anything about this study. Partitioning is `column`
  # because every artifact below holds ALL five scenarios discriminated by a
  # scenario_id column -- scenario_voltage_profiles.csv is 165 rows, 33 buses
  # times 5 scenarios. The twin partitions the other way, by file, which is
  # exactly why the contract makes a consumer read this instead of assuming.
  scenarios:
    index: outputs/data/scenarios.csv
    idColumn: scenario_id
    labelColumn: description
    artifacts:
      parameters:
        path: outputs/data/scenarios.csv
        partitioning: column
      results:
        path: outputs/data/scenario_results.csv
        partitioning: column
      voltage_profiles:
        path: outputs/data/scenario_voltage_profiles.csv
        partitioning: column
  workflow:
    file: workflow.yaml
  validation:
    senseChecker: scripts/sense_checks.py:check
    objectiveArtifacts:
      - outputs/reports/ieee33_powerflow_report.json
      - outputs/reports/ieee33_scenario_comparison_report.json
      - outputs/data/scenario_results.csv
    requiredReports:
      - outputs/reports/ieee33_powerflow_report.json
      - outputs/reports/ieee33_scenario_comparison_report.json
      - outputs/reports/ieee33_daily_timeseries_report.json
    requiredFigures:
      - outputs/figures/ieee33_voltage_profile.png
      - outputs/figures/ieee33_scenario_voltage_comparison.png
      - outputs/figures/ieee33_daily_voltage_envelope.png
    senseChecks:
      - id: daily_timeseries_all_hours_converge
        report: outputs/reports/ieee33_daily_timeseries_report.json
        field: summary.converged_hours
        equals: 24
      - id: daily_timeseries_voltage_plausible
        report: outputs/reports/ieee33_daily_timeseries_report.json
        field: summary.min_voltage_pu
        min: 0.85
