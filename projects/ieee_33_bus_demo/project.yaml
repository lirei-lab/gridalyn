apiVersion: gridalyn.io/v1alpha1
kind: StudyProject
metadata:
  name: ieee_33_bus_demo
  version: 0.1.0
  description: Demo project using Gridalyn's IEEE 33-bus benchmark feeder contract.
spec:
  pathBase: project
  problem:
    type: benchmark_powerflow_scenarios
    dataset: ieee_33_bus_benchmark
    environment: gridalyn_powerflow
    objective: Compare deterministic operating scenarios on a known radial benchmark feeder.
    model:
      type: simulation_model
      name: gridalyn_ieee_33_bus_benchmark
    scenarios:
      - id: baseline
        role: benchmark_base_case
        description: Original IEEE 33-bus feeder.
      - id: load_growth_20
        role: demand_growth_case
        description: Uniform 20 percent demand growth.
      - id: pv_midday
        role: distributed_generation_case
        description: Midday PV at selected downstream buses.
      - id: ev_evening_peak
        role: electrification_stress_case
        description: Evening EV charging demand at selected downstream buses.
      - id: pv_plus_ev
        role: mixed_der_case
        description: Combined PV and EV condition for a mixed operating case.
  experiments:
    - id: deterministic_scenario_comparison
      scenarios:
        - baseline
        - load_growth_20
        - pv_midday
        - ev_evening_peak
        - pv_plus_ev
      objective: Rank benchmark operating cases by voltage and loading impact.
      metrics:
        - min_voltage_pu
        - voltage_violation_count
        - max_line_loading_percent
      model: gridalyn_ieee_33_bus_benchmark
      artifacts:
        - outputs/reports/ieee33_powerflow_report.json
        - outputs/reports/ieee33_scenario_comparison_report.json
  inputs:
    sourceNetwork:
      name: IEEE 33-bus distribution feeder demo
      provider: gridalyn.assets.modeling.IEEE_33_BUS_BENCHMARK
      note: Gridalyn wraps the common Baran-Wu 33-bus radial distribution benchmark as a platform model contract.
  artifacts:
    project:
      data: outputs/data
      figures: outputs/figures
      manifests: outputs/manifests
      operations: outputs/operations
      reports: outputs/reports
  workflow:
    file: workflow.yaml
  validation:
    requiredReports:
      - outputs/reports/ieee33_powerflow_report.json
      - outputs/reports/ieee33_scenario_comparison_report.json
    requiredFigures:
      - outputs/figures/ieee33_voltage_profile.png
      - outputs/figures/ieee33_scenario_voltage_comparison.png
