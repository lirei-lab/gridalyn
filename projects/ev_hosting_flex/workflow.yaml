apiVersion: gridalyn.io/v1alpha1
kind: Workflow
metadata:
  name: ev_hosting_flex_pipeline
  description: >-
    Executes the governed study-B EV hosting-capacity study: synthetic radial
    twin, annual SDK-agent Monte-Carlo base + cold-coupled EV pool, cold-day
    P95 firm hosting, curtailment contracts with day-ahead notice and a fair
    real-time backstop, contract-vs-reinforcement economics, and annual AC
    power-flow validation.
spec:
  stages:
    # ── Stage 1: workspace scaffolding (live) ────────────────────────────
    - id: prepare_workspace
      command: python -m gridalyn.interfaces.cli.project prepare-workspace projects/ev_hosting_flex
      outputs:
        - projects/ev_hosting_flex/outputs/data
        - projects/ev_hosting_flex/outputs/json
        - projects/ev_hosting_flex/outputs/reports
        - projects/ev_hosting_flex/outputs/cache
        - projects/ev_hosting_flex/outputs/figures

    # ── Stage 2: topology cache via the public facade (live, TWIN-01) ────
    - id: prepare_topology_cache
      needs: [prepare_workspace]
      command: uv run python projects/ev_hosting_flex/scripts/pipeline/prepare_topology_cache.py
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/prepare_topology_cache.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/inputs/synthetic_network_config.json
      outputs:
        - projects/ev_hosting_flex/outputs/cache/pg_graph_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/grid_cache_meta.json
        - projects/ev_hosting_flex/outputs/cache/building_footprint_validation_report.json
        - projects/ev_hosting_flex/outputs/cache/topology_cache_manifest.json

    # ── Stage 3: study-B annual Monte-Carlo seam — SDK-agent annual base
    # (R_STUDY_B), day-ahead forecast bases, and the cold-coupled nested EV
    # pool (docs/superpowers/specs/2026-07-06-ev-hosting-flex-study-b-annual-
    # migration.md).
    - id: generate_annual_mc
      needs: [prepare_topology_cache]
      command: uv run python projects/ev_hosting_flex/scripts/pipeline/generate_annual_mc.py
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/generate_annual_mc.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/inputs/tmy_trois_rivieres.csv
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
        - projects/ev_hosting_flex/outputs/cache/node_building_count.json
      outputs:
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
        - projects/ev_hosting_flex/outputs/data/tday_mean_c.npy
        - projects/ev_hosting_flex/outputs/reports/annual_mc_report.json

    # ── Stage 4b: study-B annual firm hosting (live, F2 of the migration) ──
    - id: compute_congestion_annual
      needs: [generate_annual_mc]
      command: uv run python projects/ev_hosting_flex/scripts/pipeline/compute_congestion_annual.py
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/compute_congestion_annual.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
        - projects/ev_hosting_flex/outputs/data/tday_mean_c.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/firm_hosting_annual.json
        - projects/ev_hosting_flex/outputs/reports/annual_congestion_report.json

    # ── Stage 5b: study-B curtailment contracts (live, F3 of the migration) ─
    - id: apply_curtailment_contracts
      needs: [compute_congestion_annual]
      command: uv run python projects/ev_hosting_flex/scripts/pipeline/apply_curtailment_contracts.py
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/apply_curtailment_contracts.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
        - projects/ev_hosting_flex/outputs/json/firm_hosting_annual.json
      outputs:
        - projects/ev_hosting_flex/outputs/json/curtailment_hosting.json
        - projects/ev_hosting_flex/outputs/reports/curtailment_contracts_report.json

    # ── Stage 6b: study-B curtailment economics (live, F4 of the migration) ─
    - id: compute_curtailment_economics
      needs: [compute_congestion_annual]
      command: uv run python projects/ev_hosting_flex/scripts/pipeline/compute_curtailment_economics.py
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/compute_curtailment_economics.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
        - projects/ev_hosting_flex/outputs/json/firm_hosting_annual.json
      outputs:
        - projects/ev_hosting_flex/outputs/json/curtailment_economics.json
        - projects/ev_hosting_flex/outputs/reports/curtailment_economics_report.json

    # ── Stage 6c: cold-coupling comparison (the study's lead finding) ────────
    # Does a naive (cold-agnostic) EV model overestimate winter hosting? Re-runs
    # firm/flexible/curtailment on a naive counterfactual pool vs the governed
    # cold-coupled pool and quantifies the over-estimation.
    - id: analyze_cold_coupling
      needs: [generate_annual_mc]
      command: uv run python projects/ev_hosting_flex/scripts/pipeline/analyze_cold_coupling.py
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_cold_coupling.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/tday_mean_c.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/cold_coupling_comparison.json
        - projects/ev_hosting_flex/outputs/figures/cold_coupling_comparison.png
        - projects/ev_hosting_flex/outputs/reports/cold_coupling_report.json

    # ── Stage 7: pandapower AC annual validation (live, F5 of the migration) ─
    # Before/after-EV network behavior on the study-B annual artifacts: the
    # peak-day full-net scenario families (network adoption + governed feeder
    # counts incl. the curtailment backstop's served profile) plus the cold-day
    # Monte-Carlo AC sampling on the extracted feeder subnet, emitting
    # bus-voltage / line-loading / trafo-loading / MC parquet + the CSA C235
    # and thermal violations summary + before/after figures.
    - id: validate_powerflow
      needs: [compute_congestion_annual, apply_curtailment_contracts]
      command: uv run python projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
        - projects/ev_hosting_flex/outputs/data/tday_mean_c.npy
        - projects/ev_hosting_flex/outputs/json/firm_hosting_annual.json
        - projects/ev_hosting_flex/outputs/json/curtailment_hosting.json
      outputs:
        - projects/ev_hosting_flex/outputs/data/powerflow_bus_voltage.parquet
        - projects/ev_hosting_flex/outputs/data/powerflow_line_loading.parquet
        - projects/ev_hosting_flex/outputs/data/powerflow_trafo_loading.parquet
        - projects/ev_hosting_flex/outputs/data/powerflow_feeder_mc.parquet
        - projects/ev_hosting_flex/outputs/json/powerflow_violations.json
        - projects/ev_hosting_flex/outputs/figures/powerflow_feeder_mc_ecdf.png
        - projects/ev_hosting_flex/outputs/figures/powerflow_lv_voltage_bands.png
        - projects/ev_hosting_flex/outputs/figures/powerflow_trafo_loading_hist.png
        - projects/ev_hosting_flex/outputs/reports/powerflow_validation_report.json

    # ── Stage 7: canonical reports + baseline (stubbed — Phase 12) ───────
    - id: build_study_reports
      needs: [compute_curtailment_economics, validate_powerflow]
      command: echo "STUB build_study_reports — canonical study report pending"
