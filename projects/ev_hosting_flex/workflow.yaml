apiVersion: gridalyn.io/v1alpha1
kind: Workflow
metadata:
  name: ev_hosting_flex_pipeline
  description: >-
    Executes the governed study-B EV hosting-capacity study: synthetic radial
    twin, annual SDK-agent Monte-Carlo base + cold-coupled EV pool, cold-day
    P95 firm hosting, curtailment contracts with day-ahead notice and a fair
    real-time backstop, contract-vs-reinforcement economics, and annual AC
    power-flow validation.
spec:
  stages:
    # ── Stage 1: workspace scaffolding (live) ────────────────────────────
    - id: prepare_workspace
      command: "{python} -m gridalyn.interfaces.cli.project prepare-workspace projects/ev_hosting_flex"
      outputs:
        - projects/ev_hosting_flex/outputs/data
        - projects/ev_hosting_flex/outputs/json
        - projects/ev_hosting_flex/outputs/reports
        - projects/ev_hosting_flex/outputs/cache
        - projects/ev_hosting_flex/outputs/figures

    # ── Stage 2: topology cache via the public facade (live, TWIN-01) ────
    - id: prepare_topology_cache
      needs: [prepare_workspace]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.prepare_topology_cache"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/prepare_topology_cache.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/inputs/synthetic_network_config.json
      outputs:
        - projects/ev_hosting_flex/outputs/cache/pg_graph_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/grid_cache_meta.json
        - projects/ev_hosting_flex/outputs/cache/building_footprint_validation_report.json
        - projects/ev_hosting_flex/outputs/cache/topology_cache_manifest.json

    # ── Stage 2b: twin-native NetworkModel export (additive, terminal,
    # Phase 31/Milestone 14, R26) ─────────────────────────────────────────
    # Read-only w.r.t. the topology cache: adapts the already-built
    # pp_net_cache.pkl/pg_graph_cache.pkl into gridalyn.twin's canonical
    # NetworkModel Parquet tables so the observation/semantic layers can load
    # the flagship's real network. Nothing downstream depends on this stage.
    - id: export_twin_network_model
      needs: [prepare_topology_cache]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.export_twin_network_model"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/export_twin_network_model.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/inputs/synthetic_network_config.json
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/pg_graph_cache.pkl
      outputs:
        - projects/ev_hosting_flex/outputs/data/twin_network_model/grid_buses.parquet
        - projects/ev_hosting_flex/outputs/data/twin_network_model/grid_lines.parquet
        - projects/ev_hosting_flex/outputs/data/twin_network_model/grid_transformers.parquet
        - projects/ev_hosting_flex/outputs/data/twin_network_model/buildings.parquet
        - projects/ev_hosting_flex/outputs/data/twin_network_model/building_grid_connectivity.parquet
        - projects/ev_hosting_flex/outputs/data/twin_network_model/metadata.json
        - projects/ev_hosting_flex/outputs/data/twin_network_model/network_adapter_validation_report.json
        - projects/ev_hosting_flex/outputs/reports/twin_network_model_report.json

    # ── Stage 3: study-B annual Monte-Carlo seam — SDK-agent annual base
    # (R_STUDY_B), day-ahead forecast bases, and the cold-coupled nested EV
    # pool (docs/superpowers/specs/2026-07-06-ev-hosting-flex-study-b-annual-
    # migration.md).
    - id: generate_annual_mc
      needs: [prepare_topology_cache]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.generate_annual_mc"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/generate_annual_mc.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/inputs/tmy_trois_rivieres.csv
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
        - projects/ev_hosting_flex/outputs/cache/node_building_count.json
      outputs:
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
        - projects/ev_hosting_flex/outputs/data/tday_mean_c.npy
        - projects/ev_hosting_flex/outputs/reports/annual_mc_report.json

    # ── Stage 4b: study-B annual firm hosting (live, F2 of the migration) ──
    - id: compute_congestion_annual
      needs: [generate_annual_mc]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.compute_congestion_annual"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/compute_congestion_annual.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
        - projects/ev_hosting_flex/outputs/data/tday_mean_c.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/firm_hosting_annual.json
        - projects/ev_hosting_flex/outputs/reports/annual_congestion_report.json

    # ── Stage 5b: study-B curtailment contracts (live, F3 of the migration) ─
    - id: apply_curtailment_contracts
      needs: [compute_congestion_annual]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.apply_curtailment_contracts"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/apply_curtailment_contracts.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
        - projects/ev_hosting_flex/outputs/json/firm_hosting_annual.json
      outputs:
        - projects/ev_hosting_flex/outputs/json/curtailment_hosting.json
        - projects/ev_hosting_flex/outputs/reports/curtailment_contracts_report.json

    # ── Stage 6b: study-B curtailment economics (live, F4 of the migration) ─
    - id: compute_curtailment_economics
      needs: [compute_congestion_annual]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.compute_curtailment_economics"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/compute_curtailment_economics.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
        - projects/ev_hosting_flex/outputs/json/firm_hosting_annual.json
      outputs:
        - projects/ev_hosting_flex/outputs/json/curtailment_economics.json
        - projects/ev_hosting_flex/outputs/reports/curtailment_economics_report.json

    - id: analyze_credibility
      needs: [generate_annual_mc, compute_congestion_annual, apply_curtailment_contracts]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_credibility"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_credibility.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
        - projects/ev_hosting_flex/outputs/cache/node_building_count.json
      outputs:
        - projects/ev_hosting_flex/outputs/json/credibility.json
        - projects/ev_hosting_flex/outputs/figures/credibility.png
        - projects/ev_hosting_flex/outputs/reports/credibility_report.json

    - id: analyze_cold_insurance
      needs: [generate_annual_mc, analyze_credibility]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_cold_insurance"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_cold_insurance.py
        - projects/ev_hosting_flex/scripts/pipeline/analyze_credibility.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
        - projects/ev_hosting_flex/outputs/cache/node_building_count.json
      outputs:
        - projects/ev_hosting_flex/outputs/json/cold_insurance.json
        - projects/ev_hosting_flex/outputs/figures/cold_insurance.png
        - projects/ev_hosting_flex/outputs/reports/cold_insurance_report.json

    # ── Stage 6c: cold-coupling comparison (the study's lead finding) ────────
    # Does a naive (cold-agnostic) EV model overestimate winter hosting? Re-runs
    # firm/flexible/curtailment on a naive counterfactual pool vs the governed
    # cold-coupled pool and quantifies the over-estimation.
    - id: analyze_cold_coupling
      needs: [generate_annual_mc]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_cold_coupling"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_cold_coupling.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/tday_mean_c.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/cold_coupling_comparison.json
        - projects/ev_hosting_flex/outputs/figures/cold_coupling_comparison.png
        - projects/ev_hosting_flex/outputs/reports/cold_coupling_report.json

    # ── Stage 6d: network characterization (losses / substation / headroom) ──
    # Design-day full-net sweep before the economic analysis: technical losses,
    # the substation constraint, and the per-transformer hosting-headroom map.
    - id: analyze_network_characterization
      needs: [generate_annual_mc]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_network_characterization"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_network_characterization.py
        - projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/network_characterization.json
        - projects/ev_hosting_flex/outputs/figures/network_characterization.png
        - projects/ev_hosting_flex/outputs/reports/network_characterization_report.json

    - id: analyze_clustered_adoption
      needs: [generate_annual_mc]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_clustered_adoption"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_clustered_adoption.py
        - projects/ev_hosting_flex/scripts/pipeline/analyze_network_characterization.py
        - projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/clustered_adoption.json
        - projects/ev_hosting_flex/outputs/figures/clustered_adoption.png
        - projects/ev_hosting_flex/outputs/reports/clustered_adoption_report.json

    - id: analyze_flexibility_incentive
      needs: [generate_annual_mc]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_flexibility_incentive"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_flexibility_incentive.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/flexibility_incentive.json
        - projects/ev_hosting_flex/outputs/figures/flexibility_incentive.png
        - projects/ev_hosting_flex/outputs/reports/flexibility_incentive_report.json

    - id: analyze_network_performance
      needs: [generate_annual_mc]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_network_performance"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_network_performance.py
        - projects/ev_hosting_flex/scripts/pipeline/analyze_flexibility_incentive.py
        - projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/network_performance.json
        - projects/ev_hosting_flex/outputs/figures/network_performance.png
        - projects/ev_hosting_flex/outputs/reports/network_performance_report.json

    - id: analyze_congestion_risk
      needs: [generate_annual_mc]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_congestion_risk"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_congestion_risk.py
        - projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
      outputs:
        - projects/ev_hosting_flex/outputs/data/base_mc_by_size.npz
        - projects/ev_hosting_flex/outputs/json/congestion_risk.json
        - projects/ev_hosting_flex/outputs/figures/congestion_risk.png
        - projects/ev_hosting_flex/outputs/reports/congestion_risk_report.json

    - id: analyze_fleet_triage
      needs: [analyze_congestion_risk]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_fleet_triage"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_fleet_triage.py
        - projects/ev_hosting_flex/scripts/pipeline/analyze_congestion_risk.py
        - projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/data/base_mc_by_size.npz
      outputs:
        - projects/ev_hosting_flex/outputs/json/fleet_triage.json
        - projects/ev_hosting_flex/outputs/figures/fleet_triage.png
        - projects/ev_hosting_flex/outputs/reports/fleet_triage_report.json

    - id: analyze_locational_contracts
      needs: [analyze_fleet_triage]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_locational_contracts"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_locational_contracts.py
        - projects/ev_hosting_flex/scripts/pipeline/analyze_congestion_risk.py
        - projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/data/base_mc_by_size.npz
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/locational_contracts.json
        - projects/ev_hosting_flex/outputs/figures/locational_contracts.png
        - projects/ev_hosting_flex/outputs/reports/locational_contracts_report.json

    - id: analyze_nonwires_value
      needs: [analyze_network_characterization, analyze_congestion_risk]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_nonwires_value"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_nonwires_value.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/data/base_mc_by_size.npz
        - projects/ev_hosting_flex/outputs/json/network_characterization.json
      outputs:
        - projects/ev_hosting_flex/outputs/json/nonwires_value.json
        - projects/ev_hosting_flex/outputs/figures/nonwires_value.png
        - projects/ev_hosting_flex/outputs/reports/nonwires_value_report.json

    - id: analyze_phase_imbalance
      needs: [generate_annual_mc]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_phase_imbalance"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_phase_imbalance.py
        - projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/phase_imbalance.json
        - projects/ev_hosting_flex/outputs/figures/phase_imbalance.png
        - projects/ev_hosting_flex/outputs/reports/phase_imbalance_report.json

    - id: analyze_voltage_risk
      needs: [generate_annual_mc]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_voltage_risk"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_voltage_risk.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
      outputs:
        - projects/ev_hosting_flex/outputs/json/voltage_risk.json
        - projects/ev_hosting_flex/outputs/figures/voltage_risk.png
        - projects/ev_hosting_flex/outputs/reports/voltage_risk_report.json

    - id: analyze_voltage_risk_network
      needs: [generate_annual_mc]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.analyze_voltage_risk_network"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/analyze_voltage_risk_network.py
        - projects/ev_hosting_flex/scripts/pipeline/analyze_voltage_risk.py
        - projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
      outputs:
        - projects/ev_hosting_flex/outputs/json/voltage_risk_network.json
        - projects/ev_hosting_flex/outputs/figures/voltage_risk_network.png
        - projects/ev_hosting_flex/outputs/reports/voltage_risk_network_report.json

    # ── Stage 7: pandapower AC annual validation (live, F5 of the migration) ─
    # Before/after-EV network behavior on the study-B annual artifacts: the
    # peak-day full-net scenario families (network adoption + governed feeder
    # counts incl. the curtailment backstop's served profile) plus the cold-day
    # Monte-Carlo AC sampling on the extracted feeder subnet, emitting
    # bus-voltage / line-loading / trafo-loading / MC parquet + the CSA C235
    # and thermal violations summary + before/after figures.
    - id: validate_powerflow
      needs: [compute_congestion_annual, apply_curtailment_contracts]
      command: "{python} -m projects.ev_hosting_flex.scripts.pipeline.validate_powerflow"
      inputs:
        - projects/ev_hosting_flex/scripts/pipeline/validate_powerflow.py
        - projects/ev_hosting_flex/scripts/_powerflow.py
        - projects/ev_hosting_flex/scripts/_annual.py
        - projects/ev_hosting_flex/scripts/config.py
        - projects/ev_hosting_flex/outputs/cache/pp_net_cache.pkl
        - projects/ev_hosting_flex/outputs/cache/feeder_selection.json
        - projects/ev_hosting_flex/outputs/cache/downstream_bus_map.json
        - projects/ev_hosting_flex/outputs/data/base_annual.npy
        - projects/ev_hosting_flex/outputs/data/ev_fleet_annual.npy
        - projects/ev_hosting_flex/outputs/data/tday_mean_c.npy
        - projects/ev_hosting_flex/outputs/json/firm_hosting_annual.json
        - projects/ev_hosting_flex/outputs/json/curtailment_hosting.json
      outputs:
        - projects/ev_hosting_flex/outputs/data/powerflow_bus_voltage.parquet
        - projects/ev_hosting_flex/outputs/data/powerflow_line_loading.parquet
        - projects/ev_hosting_flex/outputs/data/powerflow_trafo_loading.parquet
        - projects/ev_hosting_flex/outputs/data/powerflow_feeder_mc.parquet
        - projects/ev_hosting_flex/outputs/json/powerflow_violations.json
        - projects/ev_hosting_flex/outputs/figures/powerflow_feeder_mc_ecdf.png
        - projects/ev_hosting_flex/outputs/figures/powerflow_lv_voltage_bands.png
        - projects/ev_hosting_flex/outputs/figures/powerflow_trafo_loading_hist.png
        - projects/ev_hosting_flex/outputs/reports/powerflow_validation_report.json

