apiVersion: gridalyn.io/v1alpha1
kind: StudyProject
metadata:
  name: ev_hosting_flex
  version: 0.1.0
  description: EV hosting-capacity flexibility study on a single radial distribution feeder.
spec:
  pathBase: repo
  problem:
    type: ev_hosting_capacity_flexibility
    dataset: synthetic_trois_rivieres_distribution_twin
    environment: radial_congestion_proxy_and_peak_powerflow_validation
    objective: >-
      Expand a feeder's annual EV hosting capacity by trading a small amount of
      winter charging curtailment for year-round growth via per-node flexibility
      contracts.
    model:
      type: operations_model
      name: radial_congestion_flexibility_hosting
    scenarios:
      - id: baseline
        role: firm_hosting_baseline
        description: >-
          Single radial feeder with no flexibility contracts — establishes the
          firm hosting limit (first line overload) that the flexible case
          expands upon.
  experiments:
    - id: firm_hosting_baseline
      scenario: baseline
      objective: >-
        Measure the firm EV hosting limit (first line/transformer overload) on
        the radial feeder without flexibility contracts. Extended with the
        flexible case and hosting-expansion headline in Phases 9-10.
  inputs:
    geography:
      source: configs/geography/tr01.json
    buildingFootprints:
      source: projects/ev_hosting_flex/inputs/buildings.geojson
      format: GeoJSON FeatureCollection
      role: Project-local Trois-Rivieres building footprints used to synthesize the topology cache (D-03).
    grid:
      config: projects/ev_hosting_flex/inputs/synthetic_network_config.json
  artifacts:
    project:
      data: projects/ev_hosting_flex/outputs/data
      json: projects/ev_hosting_flex/outputs/json
      reports: projects/ev_hosting_flex/outputs/reports
      cache: projects/ev_hosting_flex/outputs/cache
      figures: projects/ev_hosting_flex/outputs/figures
  workflow:
    file: projects/ev_hosting_flex/workflow.yaml
  validation:
    requiredReports:
      - projects/ev_hosting_flex/outputs/reports/topology_cache_report.json
      - projects/ev_hosting_flex/outputs/reports/design_day_mc_report.json
      - projects/ev_hosting_flex/outputs/reports/congestion_report.json
      - projects/ev_hosting_flex/outputs/reports/flexibility_contracts_report.json
      - projects/ev_hosting_flex/outputs/reports/twostage_program_report.json
      - projects/ev_hosting_flex/outputs/reports/nonwires_economics_report.json
