apiVersion: gridalyn.io/v1alpha1
kind: StudyProject
metadata:
  name: ev_hosting_flex
  version: 0.1.0
  description: >-
    EV hosting capacity and flexibility across a 540-transformer distribution
    fleet, with the transformer rating convention as a declared axis.
spec:
  simulation:
    # Declared RNG base: config.SEED; per-realization draws are SEED + r and
    # named offsets (OOS_SEED_OFFSET, ADV_SEED_OFFSET, DHW_SEED_SALT) derive from it.
    seed: 42
    # This study genuinely solves with two engines, so it declares both rather
    # than flattening them into one claim. Every solve routes through
    # _powerflow.native_backend()/lightsim_backend(); the split is verified
    # against the real call graph by tests/test_study_powerflow_routing.py, so
    # a stage that changes engine without changing this map fails the suite.
    powerflowBackend: pandapower_native
    powerflowBackendByStage:
      # network_min_voltage() -- the only lightsim2grid consumer in the study.
      analyze_voltage_risk_network: lightsim2grid
  pathBase: repo
  problem:
    type: ev_hosting_capacity_flexibility
    dataset: synthetic_trois_rivieres_distribution_twin
    environment: radial_congestion_proxy_and_peak_powerflow_validation
    objective: >-
      Determine, across the whole pole-transformer fleet, how many assets bind
      as EV adoption grows from today (0.11 EV/home) to Québec saturation
      (1.32 EV/home, every household light vehicle electrified), how many a
      flexibility contract defers, and how many need reinforcement regardless.

      The unit of analysis is the FLEET, not one feeder. Measured on this
      network, the median asset and the tail answer differently: the governed
      6-home unit hosts full saturation firmly, while a share of the 540 binds
      well before it. A single-feeder headline reports whichever of those the
      chosen feeder happens to be.

      The transformer rating is a declared axis, not an assumption. Judging a
      winter peak against a nameplate defined at a 30 °C ambient breaks the
      coupling between load and thermal capability — in a heating-dominated
      feeder both are driven by the same outdoor temperature and rise together.
      On this network that choice moves more assets than the entire EV
      transition does, so both conventions are emitted.
    model:
      type: operations_model
      name: radial_congestion_flexibility_hosting
    scenarios:
      - id: baseline
        role: firm_hosting_baseline
        description: >-
          Single radial feeder with no flexibility contracts — establishes the
          firm hosting limit (first line overload) that the flexible case
          expands upon.
  experiments:
    - id: fleet_triage
      scenario: baseline
      objective: >-
        Classify every pole transformer in the fleet at each adoption level and
        adoption-clustering level, under both rating conventions: never binds /
        flexibility defers it / needs steel / constrained by the winter heating
        base. This is the study's primary result; the per-feeder stages below
        are the worked example behind it.
    - id: firm_hosting_baseline
      scenario: baseline
      objective: >-
        Measure the firm EV hosting limit (first line/transformer overload) on
        the radial feeder without flexibility contracts. Extended with the
        flexible case and hosting-expansion headline in Phases 9-10.
  inputs:
    geography:
      source: configs/geography/tr01.json
    buildingFootprints:
      source: projects/ev_hosting_flex/inputs/buildings.geojson
      format: GeoJSON FeatureCollection
      role: Project-local Trois-Rivieres building footprints used to synthesize the topology cache (D-03).
    grid:
      config: projects/ev_hosting_flex/inputs/synthetic_network_config.json
  artifacts:
    project:
      data: projects/ev_hosting_flex/outputs/data
      json: projects/ev_hosting_flex/outputs/json
      reports: projects/ev_hosting_flex/outputs/reports
      cache: projects/ev_hosting_flex/outputs/cache
      figures: projects/ev_hosting_flex/outputs/figures
  workflow:
    file: projects/ev_hosting_flex/workflow.yaml
  validation:
    requiredReports:
      - projects/ev_hosting_flex/outputs/reports/topology_cache_report.json
      - projects/ev_hosting_flex/outputs/reports/annual_mc_report.json
      - projects/ev_hosting_flex/outputs/reports/fleet_triage_report.json
      - projects/ev_hosting_flex/outputs/reports/annual_congestion_report.json
      - projects/ev_hosting_flex/outputs/reports/curtailment_contracts_report.json
      - projects/ev_hosting_flex/outputs/reports/curtailment_economics_report.json
      - projects/ev_hosting_flex/outputs/reports/cold_coupling_report.json
      - projects/ev_hosting_flex/outputs/reports/network_characterization_report.json
      - projects/ev_hosting_flex/outputs/reports/powerflow_validation_report.json
