site_name: Gridalyn
site_dir: ../site
docs_dir: .
# ``docs_dir: .`` means every markdown file beneath docs/ is built, whether or
# not it appears in ``nav``. ``superpowers/`` holds AI-assistant plan and spec
# records that are git-ignored, so a CI build (which checks out from git) never
# sees them -- but a local ``mkdocs build`` or ``gh-deploy`` would sweep 41
# such pages onto the published site. This repo deliberately purged
# AI-assistant material in the 2026-08-04 history rewrite; excluding the tree
# keeps a local deploy from undoing that, without deleting a contributor's
# untracked working files. The pattern is gitignore-style and matches nothing
# in a clean checkout, which is why it is silent rather than an error there.
exclude_docs: |
  superpowers/
  components/_merge/
  reference/_merge/
  development/
nav:
  - Home: index.md
  - Start:
      - What Is Gridalyn?: start/what-is-gridalyn.md
      - Installation: start/installation.md
      - Quickstart: start/quickstart.md
      - Your First Study: start/first-study.md
      - Reading The Outputs: start/reading-the-outputs.md
      - Run The Demo Projects: start/run-demo-projects.md
  - Components:
      - Component Overview: components/overview.md
      - Foundation: components/foundation.md
      - Twin: components/twin.md
      - Assets: components/assets.md
      - Simulation: components/simulation.md
      - Operations: components/operations.md
      - Projects: components/projects.md
      - Interfaces: components/interfaces.md
  - Guides:
      # Ordered as the sequence a study moves through -- declare, model,
      # design the mechanism, validate, publish -- not alphabetically. The
      # same order is the layer import direction and the workflow stage-id
      # verb order; see guides/overview.md.
      - Guide Overview: guides/overview.md
      - Build Your Own Project: guides/build-your-own-project.md
      - Project Template: guides/project-template.md
      - Build A Twin: guides/build-a-twin.md
      - Synthetic Networks From GeoJSON: guides/synthetic-network-from-geojson.md
      - Author A Workflow: guides/author-a-workflow.md
      - Reproducibility: guides/reproducibility.md
      - Reports And Figures: guides/reports-and-figures.md
      - Open The Dashboard: guides/open-the-dashboard.md
      - Write An Extension: guides/write-an-extension.md
  - Reference:
      - Reference Overview: reference/overview.md
      - CLI: reference/cli.md
      - Python API: reference/python-api.md
      - Public API Index: reference/public-api.md
      - Workflow YAML: reference/workflow-yaml.md
      - Report Schema: reference/report-schema.md
      - Semantic Graph: reference/semantic-graph.md
      - FalkorDB Path: reference/falkordb.md
      - Artifact Policy: reference/artifact-policy.md
      - Glossary: reference/glossary.md
  - Contributing:
      - Contributing Overview: contributing/overview.md
      - Module Boundaries: contributing/module-boundaries.md
      - Conventions: contributing/conventions.md
      - Developer Workflow: contributing/developer-workflow.md
      - Project Hygiene: contributing/project-hygiene.md
      - Testing And Validation: contributing/testing-and-validation.md
      - Operator Verification: contributing/verification.md
      - Releasing: contributing/releasing.md
theme:
  name: material
  logo: _static/logo.png
  favicon: _static/logo.png
  features:
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lirei-lab/gridalyn
markdown_extensions:
  # `!!! note` blocks render as literal text without this; the docs use them to
  # carry the class statement on the twin surfaces.
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
