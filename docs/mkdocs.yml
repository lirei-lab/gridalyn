theme:
  name: material
  logo: _static/logo.png
  favicon: _static/logo.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - stylesheets/extra.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lirei-lab/gridalyn
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - ..
          options:
            docstring_style: google
            docstring_section_style: table
            docstring_options:
              # Griffe's Google parser defaults this to ``true``, which splits a
              # multi-line ``Returns:`` block into one returned value per line
              # and reads a leading ``float:`` as a value *name* rather than a
              # type. This repository documents a single return in prose, never
              # several named values, so ``false`` is what its docstrings
              # actually mean. Left at the default, every ``@property`` with a
              # multi-line ``Returns:`` fails ``mkdocs build --strict``: the
              # signature annotation is unavailable under ``force_inspection``
              # (below), so each split line renders as an un-annotated return.
              returns_multiple_items: false
              # Also a griffe default (``true``) that misreads this repo's
              # style: it parses ``float: description`` as a *named* return
              # value called "float" instead of a return *typed* ``float``.
              # Nothing here names its return values, so a leading token before
              # the colon is always a type.
              returns_named_value: false
            # The layer facades expose their public names through a lazy
            # ``__getattr__`` over ``_LAZY_EXPORTS``. Static analysis cannot see
            # those names, so the handler must inspect the imported module.
            force_inspection: true
            show_root_heading: true
            show_root_full_path: true
            show_source: false
            show_submodules: false
            show_if_no_docstring: false
            show_labels: false
            members_order: alphabetical
            filters:
              - "!^_"
            heading_level: 2
