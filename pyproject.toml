[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
authors = [
    {name = "Gridalyn Contributors"},
]
license = "MIT"
requires-python = "<4.0,>=3.12.0"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "networkx>=2.6.0",
    "pandapower @ git+https://github.com/e2nIEE/pandapower.git@develop",
    "pvlib>=0.10.0",
    "geopy>=2.2.0",
    "scipy>=1.7.0",
    "shapely>=1.7.0",
    "geopandas>=0.9.0",
    "scikit-learn>=0.24.0",
    "rdflib>=7.1.0",
    "folium<1.0.0,>=0.19.4",
    "timeout-decorator<1.0.0,>=0.5.0",
    "numba<1.0.0,>=0.60.0",
    "tqdm<5.0.0,>=4.67.1",
    "osmnx<3.0.0,>=2.0.1",
    "leafmap>=0.51.0",
    "pre-commit>=4.1.0",
    "mkdocs>=1.6.1",
    "mkdocs-bootswatch>=1.1",
    "mkdocs-material>=9.6.17",
    "mkdocstrings[python]>=0.30.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-autorefs>=1.4.2",
    "falkordblite>=0.9.0",
    "lightsim2grid>=0.12.2",
    "contextily>=1.7.0",
    "fastparquet>=2026.3.0",
    "seaborn>=0.13.2",
    "tables>=3.11.1",
    "lightgbm>=4.6.0",
    "cvxpy>=1.8.2",
    "pytest>=8.3.4",
]
name = "gridalyn"
version = "0.1.0"
description = "Utility digital-twin platform for distribution networks, governed workflows, and flexibility operations"
readme = "README.md"

[project.urls]
Documentation = "https://lirei-uqtr.github.io/gridalyn"
Source = "https://github.com/lirei-uqtr/gridalyn"
Tracker = "https://github.com/lirei-uqtr/gridalyn/issues"

[project.scripts]
gridalyn = "gridalyn.interfaces.cli.gridalyn:main"
gridalyn-dashboard = "gridalyn.interfaces.cli.dashboard:main"
gridalyn-dt = "gridalyn.interfaces.cli.digital_twin:main"
gridalyn-flex = "gridalyn.interfaces.cli.flexibility:main"
gridalyn-platform = "gridalyn.interfaces.cli.platform:main"
gridalyn-project = "gridalyn.interfaces.cli.project:main"
gridalyn-semantic = "gridalyn.interfaces.cli.semantic:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gridalyn*"]
exclude = ["tests*"]

[project.optional-dependencies]
cim = [
    "cim-graph>=0.4.3a12",
    "rdflib>=7.1.0",
]
dev = [
    "black>=21.0",
    "flake8>=3.9.0",
    "isort>=5.8.0",
    "pytest>=6.2.0",
    "pytest-cov>=2.8.0",
    "pre-commit<5.0.0,>=4.1.0",
    "furo<2025.0.0,>=2024.8.6",
    "hypothesis<7.0.0,>=6.123.16",
    "pip<25.0.0,>=24.3.1",
    "jupyterlab<5.0.0,>=4.3.4",
    "ipykernel>=6.29.5",
]
