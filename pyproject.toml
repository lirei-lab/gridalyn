[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"


[project]
authors = [
    {name = "Gridalyn Contributors"},
]
license = "MIT"
requires-python = "<4.0,>=3.12.0"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "PyYAML>=6.0.2",
    "matplotlib>=3.4.0",
    "networkx>=2.6.0",
    "pandapower>=3.1.2",
    "pvlib>=0.10.0",
    "geopy>=2.2.0",
    "scipy>=1.7.0",
    "shapely>=1.7.0",
    "geopandas>=0.9.0",
    "scikit-learn>=0.24.0",
    # Base, not optional: the packaged macro weights are LightGBM models, and
    # without the runtime ParametricArxGenerator falls back to a different
    # analytical macro model. It warns and keeps going, so the same code and the
    # same seed produce different load profiles depending on whether an optional
    # extra was installed -- measured at -14% to +32% on the generated base
    # depending on the weather series. A reproducibility promise cannot depend
    # on an extra.
    "lightgbm>=4.6.0",
    "jsonschema>=4.0.0",
    "folium<1.0.0,>=0.19.4",
    "timeout-decorator<1.0.0,>=0.5.0",
    "numba<1.0.0,>=0.60.0",
    "tqdm<5.0.0,>=4.67.1",
    "leafmap>=0.51.0",
    "contextily>=1.7.0",
    "fastparquet>=2026.3.0",
    "seaborn>=0.13.2",
    "tables>=3.11.1",
    # Phase 21: declared, not transitive. gridalyn/twin/core/ontology.py uses
    # pydantic BaseModel for its topological grid-node classes; it was an
    # undeclared dependency before (only reachable through core/graph.py).
    "pydantic>=2.0.0",
]
name = "gridalyn"
version = "0.1.0"
# The product framing below is deliberate and pinned by
# tests/test_project_hygiene.py::test_public_readme_uses_current_platform_contract
# since the public release (0b085f8d, 2026-05-19): "utility digital-twin
# platform" describes what this SDK is *for building*, not a claim that any
# shipped layer is a digital twin today.
# Do not conflate it with the class of `gridalyn.twin`, which is narrower: under
# the Kritzinger taxonomy (classes differ by automated data flow, not fidelity)
# that layer is a digital *model* with provenance -- not a shadow, not a twin.
# Both statements are true at once, and the docs state the second wherever they
# state the first. See docs/concepts/network-model.md#what-class-of-thing-this-is.
description = "Utility digital-twin platform for distribution networks, governed workflows, and flexibility operations"
readme = "README.md"

[project.urls]
Documentation = "https://lirei-lab.github.io/gridalyn"
Source = "https://github.com/lirei-lab/gridalyn"
Tracker = "https://github.com/lirei-lab/gridalyn/issues"

[project.scripts]
gridalyn = "gridalyn.interfaces.cli.gridalyn:main"
gridalyn-dashboard = "gridalyn.interfaces.cli.dashboard:main"
gridalyn-dt = "gridalyn.interfaces.cli.digital_twin:main"
gridalyn-flex = "gridalyn.interfaces.cli.flexibility:main"
gridalyn-platform = "gridalyn.interfaces.cli.platform:main"
gridalyn-project = "gridalyn.interfaces.cli.project:main"
gridalyn-semantic = "gridalyn.interfaces.cli.semantic:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gridalyn*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
gridalyn = [
    "assets/datagen/models/weights/*.pkl",
    # Read at runtime by gridalyn/projects/validation.py via
    # `SCHEMA_DIR = Path(__file__).parent / "schemas"`. Without this glob
    # `validate_project` raises FileNotFoundError on a pip-installed gridalyn.
    "projects/schemas/*.json",
]

[project.optional-dependencies]
geo = [
    "contextily>=1.7.0",
    "geopandas>=0.9.0",
    "geopy>=2.2.0",
    "osmnx<3.0.0,>=2.0.1",
    "shapely>=1.7.0",
]
sim = [
    "lightsim2grid>=0.12.2",
    "matplotlib>=3.4.0",
    "pandapower>=3.1.2",
    "pvlib>=0.10.0",
    "scipy>=1.7.0",
    "timeout-decorator<1.0.0,>=0.5.0",
]
ops = [
    "cvxpy>=1.8.2",
    "numba<1.0.0,>=0.60.0",
    "scikit-learn>=0.24.0",
]
dashboard = [
    "folium<1.0.0,>=0.19.4",
    "leafmap>=0.51.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.13.2",
]
all = [
    "contextily>=1.7.0",
    "cvxpy>=1.8.2",
    "folium<1.0.0,>=0.19.4",
    "geopandas>=0.9.0",
    "geopy>=2.2.0",
    "leafmap>=0.51.0",
    "lightsim2grid>=0.12.2",
    "matplotlib>=3.4.0",
    "numba<1.0.0,>=0.60.0",
    "osmnx<3.0.0,>=2.0.1",
    "pandapower>=3.1.2",
    "pvlib>=0.10.0",
    "scikit-learn>=0.24.0",
    "scipy>=1.7.0",
    "seaborn>=0.13.2",
    "shapely>=1.7.0",
    "tables>=3.11.1",
    "timeout-decorator<1.0.0,>=0.5.0",
]
# NO `rdflib` HERE, AND NOT IN `dependencies` -- THIS IS DELIBERATE.
# Phase 9 (2026-08-07) deleted gridalyn/twin/io/cim.py, an RDF/XML exporter with
# zero importers and zero tests, and dropped rdflib with it because that exporter
# was its only consumer. The reasoning was "no consumer", not "CIM is wrong":
# CGMES is adopted as *fields and rules over parquet* in
# gridalyn/twin/adapters/authority.py -- Model Authority Sets and profile
# declarations, validated on every load_snapshot of both producers -- with no
# serialization format and no graph library. A test pins real rdflib imports
# under gridalyn/ at 0 by AST scan, so adding the dependency back without a
# consumer turns the suite red rather than passing unnoticed.
# If a consumer for CGMES RDF/XML ever appears, add the dependency *with* it.
# Rationale in full: docs/platform/digital-twin.md, "Why there is no rdflib".
# `cim-graph` below is for external experimentation only; it has no in-repo consumer.
cim = [
    "cim-graph>=0.4.3a12",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.2",
    "mkdocs-bootswatch>=1.1",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-material>=9.6.17",
    "mkdocs-redirects>=1.2.2",
    "mkdocstrings[python]>=0.30.0",
]
# What it takes to RUN the suite, and nothing else. CI installs ".[all,test]"
# rather than ".[dev]" because the dev extra is assembled for a human at a
# keyboard -- it carries JupyterLab, the docs toolchain, Sphinx/furo and the
# linters, 97 packages that no test imports. Keep this list minimal: anything
# added here is installed three times on every push.
test = [
    "pytest>=8.3.4",
    "pytest-cov>=2.8.0",
    "hypothesis<7.0.0,>=6.123.16",
]
# Pinned exactly, not floored: the mypy baseline in .mypy-baseline is a count,
# and a different analyser version returns a different count for an unchanged
# tree. The pre-push hook and the CI typecheck job both install this, so both
# read the same number.
typing = [
    "mypy==1.9.0",
    "types-requests",
    "types-PyYAML",
]
dev = [
    "black>=21.0",
    "mypy==1.9.0",
    "types-requests",
    "types-PyYAML",
    "contextily>=1.7.0",
    "cvxpy>=1.8.2",
    "flake8>=3.9.0",
    # The two plugins the pre-commit gate loads. Declared here as well, because
    # without them a `pip install -e ".[dev]"` environment runs a WEAKER flake8
    # than the gate: measured 2026-08-29, the tree reported 0 violations
    # locally and 67 under the gate's configuration -- B950/B905/B008 findings
    # the plugin-less build cannot see. Two versions, two truths, and a local
    # check that approves what the gate rejects.
    "flake8-bugbear",
    "flake8-docstrings",
    "folium<1.0.0,>=0.19.4",
    "geopandas>=0.9.0",
    "geopy>=2.2.0",
    "isort>=5.8.0",
    "leafmap>=0.51.0",
    "lightsim2grid>=0.12.2",
    "matplotlib>=3.4.0",
    "numba<1.0.0,>=0.60.0",
    "osmnx<3.0.0,>=2.0.1",
    "pandapower>=3.1.2",
    "pytest>=8.3.4",
    "pytest-cov>=2.8.0",
    "pvlib>=0.10.0",
    "scikit-learn>=0.24.0",
    "scipy>=1.7.0",
    "seaborn>=0.13.2",
    "shapely>=1.7.0",
    "tables>=3.11.1",
    "timeout-decorator<1.0.0,>=0.5.0",
    "pre-commit<5.0.0,>=4.1.0",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.2",
    "mkdocs-bootswatch>=1.1",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-material>=9.6.17",
    "mkdocstrings[python]>=0.30.0",
    "furo<2025.0.0,>=2024.8.6",
    "hypothesis<7.0.0,>=6.123.16",
    "pip<25.0.0,>=24.3.1",
    "jupyterlab<5.0.0,>=4.3.4",
    "ipykernel>=6.29.5",
]

# Slow-tier marker (#19). The annual byte-stability seal
# (tests/test_ev_hosting_flex_annual_seal.py) re-runs four governed pipeline
# stages and costs ~287 s — over half the suite's wall time. The marker tiers
# it WITHOUT weakening the property: a default ``pytest -q`` still runs it
# (CI passes no ``-m`` filter, and the operator's full local run is the run
# that proves byte-stability). Local fast iteration may opt out via
# ``-m "not slow"`` (deselects) or ``GRIDALYN_SKIP_SLOW=1`` (skips with a
# visible reason in the skip summary).
[tool.pytest.ini_options]
markers = [
    "slow: multi-minute test (the ~287 s annual byte-stability seal); runs by default and in CI-equivalent full runs, deselect locally with -m 'not slow' or skip visibly with GRIDALYN_SKIP_SLOW=1",
]

# Subprocess-aware coverage (#18). The workflow runner spawns every stage via
# ``subprocess.run(shell=True)`` (gridalyn/projects/runner.py), so a plain
# ``coverage run`` / ``pytest --cov`` measures ONLY the parent process and the
# 77 stage scripts' SDK calls read as uncovered. To include subprocesses:
#
#   export COVERAGE_PROCESS_START="$PWD/pyproject.toml"
#   export COVERAGE_FILE="$PWD/.coverage"   # keep data files out of projects/
#   export PYTHONPATH="<dir containing a sitecustomize.py that runs:
#                       import coverage; coverage.process_startup()>"
#   python -m gridalyn.interfaces.cli.project run projects/<study>  # per study
#   coverage combine && coverage report
#
# Mechanism choice, justified: coverage 7.10+ has ``patch = ["subprocess"]``,
# but older coverage (7.6.x, the version existing local envs resolved through
# pytest-cov) only WARNS "Unrecognized option" and silently measures nothing —
# a config that claims subprocess scope without delivering it. The
# COVERAGE_PROCESS_START + sitecustomize hook works on every supported
# coverage version and is inert unless the env var is set, so plain
# ``pytest -q`` and ``pytest --cov`` behave exactly as before.
#
# * parallel: each process writes its own suffixed data file (no clobbering
#   between the runner and its stage subprocesses); run ``coverage combine``
#   before ``coverage report``. pytest-cov combines automatically.
# * sigterm: a stage terminated by the runner still flushes its data.
# * source: the SDK package — the same scope as the operator-verified
#   full-suite baseline (74%, measured 2026-08-05 via ``--cov=gridalyn``; see
#   docs/development/verification.md), so the numbers stay comparable.
[tool.coverage.run]
source = ["gridalyn"]
parallel = true
sigterm = true
