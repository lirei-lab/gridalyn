name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package with runtime and test extras
        # ".[all,test]" not ".[dev]": the dev extra additionally pulls
        # JupyterLab, the docs toolchain, Sphinx/furo and the linters -- 97
        # packages (282 -> 185) that nothing under test imports, installed once
        # per job on every push.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"

      - name: Run test suite
        run: python -m pytest -q --durations=15

  projects:
    # End-to-end contract gate. The governed study outputs are gitignored, so the
    # reproduce-and-pin tests SKIP in CI — without this job nothing would actually
    # exercise StudyProject YAML -> Workflow runner -> platform report -> regression
    # baseline. These six studies run in ~75 s total, so CI can prove the whole
    # contract end-to-end on every push. (The research studies — ev_hosting_flex
    # and admm_thermal_consensus — are far too heavy for CI: their
    # baselines stay operator-verified, see docs/projects/.)
    name: Governed project contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package with runtime and test extras
        # ".[all,test]" not ".[dev]": the dev extra additionally pulls
        # JupyterLab, the docs toolchain, Sphinx/furo and the linters -- 97
        # packages (282 -> 185) that nothing under test imports, installed once
        # per job on every push.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"

      - name: Smoke-run the documented instruction subset
        # The instruction ledger (docs/development/instruction-ledger.json)
        # classifies 350 fenced doc blocks and pins each one's sha1; the gate
        # that enforces it, tests/test_doc_instructions.py, runs in the `test`
        # job in under a second. But that gate only proves the ledger still
        # DESCRIBES the docs -- it never runs a single documented command, so a
        # CLI rename would leave every verdict green while the docs rotted.
        #
        # This step closes that hole for a measured, representative subset.
        # MEASURED 2026-08-06, three runs on the phase-7 tree: 13.82 / 13.74 /
        # 14.16 s, against the 90 s budget. It rides this job rather than a new
        # one because a fourth job would pay a second checkout and a second
        # `pip install -e ".[all,test]"` -- minutes of duplication to host
        # fourteen seconds of work.
        #
        # IT RUNS BEFORE THE STUDY LOOP, DELIBERATELY. `doctor` and
        # `check-artifacts` are exactly the commands that used to fail on a
        # fresh checkout, because they inherited an artifact check over projects
        # nothing had run yet. Run them after the loop and six studies' outputs
        # would be sitting there, and the regression this guards could not
        # reproduce.
        #
        # WHAT IT DOES NOT PROVE, so nobody reads more into a green: it covers
        # 14 of the corpus's 159 runnable instructions, chosen for breadth of
        # command surface rather than depth. It cannot catch a doc that
        # instructs the right commands in the wrong ORDER -- the dominant defect
        # the wave-2 sweep found, 8 of 13 fixes -- because that needs a clean
        # workspace per chain. The full sweep stays an operator protocol;
        # docs/development/instruction-verification.md carries the command.
        run: |
          set -euo pipefail
          G="python -m gridalyn.interfaces.cli.gridalyn"
          SCRATCH="$(mktemp -d)"
          trap 'rm -rf "${SCRATCH}"' EXIT

          echo "::group::documented command surface"
          # README.md#3, quickstart.md#1, reference/cli.md#0,
          # reproducibility.md#3, index.md#0
          $G --help > /dev/null
          # quickstart.md#2
          $G validate > /dev/null
          # quickstart.md#3 -- the fresh-checkout case, see above
          $G doctor > /dev/null
          # development/artifact-policy.md#1, tutorials/
          # build-minimal-digital-twin.md#1, reproducibility.md#4
          $G platform check-artifacts --summary-only > /dev/null
          # index.md#0
          $G project validate projects/minimal_grid_project > /dev/null
          # projects/project-model.md#3, retargeted to scratch so the repo's
          # own projects/ tree is never written to
          $G project init "${SCRATCH}/my_minimal_case" --template minimal > /dev/null
          echo "::endgroup::"

          echo "::group::documented chains"
          # getting-started/first-hour.md#3 -- run, then check artifacts, then
          # verify, in the order the document gives them
          $G project run projects/minimal_grid_project > /dev/null
          $G project status projects/minimal_grid_project --check-artifacts > /dev/null
          $G project verify projects/minimal_grid_project > /dev/null
          # quickstart.md#seq0 member #4, from a clean directory
          ( cd "${SCRATCH}" && $G quickstart my-first-study > /dev/null )
          echo "::endgroup::"

          # None of the above may touch a tracked file. Documented commands have
          # regressed into writing the repository's own committed artifacts
          # before (the dashboard catalog, finding #40), and that lands as a
          # dirty index rather than a non-zero exit -- so exit status alone
          # would not have caught it.
          DIRT="$(git status --porcelain)"
          if [ -n "${DIRT}" ]; then
            echo "documented commands dirtied the working tree:"
            echo "${DIRT}"
            exit 1
          fi

      - name: Run fast governed studies and verify their baselines
        # Subprocess coverage (#18) is wired in [tool.coverage.run] but
        # deliberately NOT carried by this job — a measured cost-benefit call
        # (2026-08-06, six fixtures, local): uninstrumented 80 s; parent-only
        # coverage 89 s at 7% of gridalyn (the stages run as subprocesses, so
        # the parent measures almost nothing); subprocess-hooked coverage 159 s
        # at 24%. Doubling this job's study loop would buy a number that no CI
        # consumer reads: there is no coverage threshold or upload by design
        # (docs/development/verification.md — "measured, not enforced"). The
        # operator command that produces the 24%-scope number lives in the
        # [tool.coverage.run] comment in pyproject.toml; revisit if a coverage
        # ratchet or upload ever gains a consumer.
        run: |
          set -euo pipefail
          for project in \
            minimal_grid_project \
            synthetic_geojson_feeder \
            ieee_33_bus_demo \
            der_voltage_optimization \
            prosumer_battery_market \
            rl_voltage_control_lightsim
          do
            echo "::group::${project}"
            python -m gridalyn.interfaces.cli.project run "projects/${project}"
            python -m gridalyn.interfaces.cli.project regression "projects/${project}"
            echo "::endgroup::"
          done

  typecheck:
    # Type checking was claimed but never enforced: CLAUDE.md stated mypy ran
    # with --disallow-untyped-defs, yet it existed only as a local pre-commit
    # hook. The "skipped in CI because it can be slow" justification does not
    # survive a stopwatch -- mypy costs ~16 s cold over all 183 files, against a
    # test job budgeted 40 minutes and a projects job that runs six end-to-end
    # studies in ~78 s.
    #
    # THIS JOB REPORTS; IT DOES NOT BLOCK THE CURRENT TREE. The baseline is a
    # real backlog, not zero, and a gate that fails on day one gets turned off.
    # It fails only when the count RISES, so new type errors cannot enter
    # silently while the existing ones are paid down deliberately.
    #
    # The comparison itself lives in tools/mypy_ratchet.py and the number in
    # .mypy-baseline, so this job and the pre-push hook run the same logic
    # against the same figure. They previously duplicated it -- inline bash here
    # and a plain mypy hook there -- which is how the hook came to approve what
    # this job rejected.
    name: Type check (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package with runtime, test and typing extras
        # The baseline is only meaningful alongside the environment it was
        # measured in: mypy's reading depends on which third-party stubs
        # resolve, and the same tree reports 145 here against roughly 126 in an
        # isolated env that cannot see them. ".[all,test,typing]" is that
        # environment, and it is what tools/mypy_ratchet.py expects locally too.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test,typing]"

      - name: Run the ratchet
        run: |
          python tools/mypy_ratchet.py | tee -a "${GITHUB_STEP_SUMMARY}"

  lint:
    # Lints only the files changed in the pull request, mirroring the local
    # pre-commit hook behavior; the full tree does not yet pass all hooks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .pre-commit-config.yaml

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit on changed files
        # SKIP=mypy: type checking in CI belongs to the `typecheck` job above,
        # which is purpose-built for it -- it pins the analyser to the
        # pre-commit rev, pins the stub environment, and ratchets against a
        # measured baseline so the count can only fall. Running the mypy hook
        # here as well would type-check the *whole* of every file a PR touches,
        # so any change to a legacy module inherits that module's full backlog
        # and the job fails for reasons the PR did not cause. Two gates on one
        # signal, disagreeing, means the blocking one is the accidental one.
        # The hook still runs locally on commit, which is the posture CLAUDE.md
        # describes. black, isort and flake8 continue to block here.
        env:
          SKIP: mypy
        run: |
          git fetch origin ${{ github.base_ref }}
          pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
