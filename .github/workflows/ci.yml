name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package with runtime and test extras
        # ".[all,test]" not ".[dev]": the dev extra additionally pulls
        # JupyterLab, the docs toolchain, Sphinx/furo and the linters -- 97
        # packages (282 -> 185) that nothing under test imports, installed once
        # per job on every push.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"

      - name: Run test suite
        run: python -m pytest -q --durations=15

  projects:
    # End-to-end contract gate. The governed study outputs are gitignored, so the
    # reproduce-and-pin tests SKIP in CI — without this job nothing would actually
    # exercise StudyProject YAML -> Workflow runner -> platform report -> regression
    # baseline. These six studies run in ~75 s total, so CI can prove the whole
    # contract end-to-end on every push. (The research studies — ev_hosting_flex
    # and admm_thermal_consensus — are far too heavy for CI: their
    # baselines stay operator-verified, see docs/projects/.)
    name: Governed project contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package with runtime and test extras
        # ".[all,test]" not ".[dev]": the dev extra additionally pulls
        # JupyterLab, the docs toolchain, Sphinx/furo and the linters -- 97
        # packages (282 -> 185) that nothing under test imports, installed once
        # per job on every push.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"

      - name: Run fast governed studies and verify their baselines
        run: |
          set -euo pipefail
          for project in \
            minimal_grid_project \
            synthetic_geojson_feeder \
            ieee_33_bus_demo \
            der_voltage_optimization \
            prosumer_battery_market \
            rl_voltage_control_lightsim
          do
            echo "::group::${project}"
            python -m gridalyn.interfaces.cli.project run "projects/${project}"
            python -m gridalyn.interfaces.cli.project regression "projects/${project}"
            echo "::endgroup::"
          done

  typecheck:
    # Type checking was claimed but never enforced: CLAUDE.md states mypy runs
    # with --disallow-untyped-defs, yet it existed only as a local pre-commit
    # hook. The "skipped in CI because it can be slow" justification does not
    # survive a stopwatch — mypy costs 16.3 s cold over all 183 files, against a
    # test job budgeted 40 minutes and a projects job that runs six end-to-end
    # studies in ~78 s. Measurement and full error inventory:
    # .planning/phases/03-verification-net/03-03-TYPECHECK-EVIDENCE.md
    #
    # THIS JOB REPORTS; IT DOES NOT BLOCK THE CURRENT TREE. The baseline is 147
    # errors, not zero, and a gate that fails on day one gets turned off. It
    # fails only when the count RISES above the baseline, so new type errors
    # cannot enter silently while the existing ones are paid down deliberately.
    name: Type check (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Ratchet. LOWER this as errors are fixed; never raise it to make CI pass.
      # Measured with the dev extra AND types-requests installed, which is what
      # the step below installs. Reproduce it locally with exactly that pair or
      # the count will not match: types-requests alone moves it by one, and the
      # pre-commit hook's isolated env, which sees neither, reports 21 fewer
      # (126) for the same tree. Every one of those figures is real; they differ
      # by stub visibility alone, which is why the baseline names its
      # environment instead of just its number.
      MYPY_BASELINE: "145"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package with runtime and test extras
        # ".[all,test]" not ".[dev]": the dev extra additionally pulls
        # JupyterLab, the docs toolchain, Sphinx/furo and the linters -- 97
        # packages (282 -> 185) that nothing under test imports, installed once
        # per job on every push.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"

      - name: Install mypy pinned to the pre-commit rev
        # Pinned to the rev in .pre-commit-config.yaml so local and CI run the
        # same analyser and the baseline count stays reproducible. The dev extra
        # does not carry mypy; installing it here keeps the type-check tool out
        # of every other job's dependency resolution.
        run: python -m pip install "mypy==1.9.0" types-requests

      - name: Run mypy against the baseline
        run: |
          set -uo pipefail
          python -m mypy --ignore-missing-imports --disallow-untyped-defs \
            gridalyn > mypy.log 2>&1 || true
          cat mypy.log

          # Parse the summary line rather than counting matches, and fail loudly
          # if it is absent: a crashed mypy prints no errors, and "no errors"
          # must never be mistaken for "clean".
          if grep -qE '^Success: no issues found' mypy.log; then
            count=0
          elif grep -qE '^Found [0-9]+ errors? in ' mypy.log; then
            count=$(sed -nE 's/^Found ([0-9]+) errors? in .*/\1/p' mypy.log | tail -1)
          else
            echo "::error::mypy produced no recognisable summary line — it most"
            echo "::error::likely crashed. Refusing to report this as a pass."
            exit 1
          fi

          echo "mypy errors: ${count} (baseline ${MYPY_BASELINE})"
          echo "### mypy: ${count} errors (baseline ${MYPY_BASELINE})" \
            >> "${GITHUB_STEP_SUMMARY}"

          if [ "${count}" -gt "${MYPY_BASELINE}" ]; then
            echo "::error::mypy error count rose from ${MYPY_BASELINE} to ${count}."
            echo "::error::Fix the new type errors listed above. Do not raise"
            echo "::error::MYPY_BASELINE in .github/workflows/ci.yml to go green."
            exit 1
          fi

          if [ "${count}" -lt "${MYPY_BASELINE}" ]; then
            echo "::notice::mypy error count dropped to ${count}. Lower"
            echo "::notice::MYPY_BASELINE in .github/workflows/ci.yml to ${count}"
            echo "::notice::to lock the improvement in."
          fi

  lint:
    # Lints only the files changed in the pull request, mirroring the local
    # pre-commit hook behavior; the full tree does not yet pass all hooks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .pre-commit-config.yaml

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit on changed files
        # SKIP=mypy: type checking in CI belongs to the `typecheck` job above,
        # which is purpose-built for it -- it pins the analyser to the
        # pre-commit rev, pins the stub environment, and ratchets against a
        # measured baseline so the count can only fall. Running the mypy hook
        # here as well would type-check the *whole* of every file a PR touches,
        # so any change to a legacy module inherits that module's full backlog
        # and the job fails for reasons the PR did not cause. Two gates on one
        # signal, disagreeing, means the blocking one is the accidental one.
        # The hook still runs locally on commit, which is the posture CLAUDE.md
        # describes. black, isort and flake8 continue to block here.
        env:
          SKIP: mypy
        run: |
          git fetch origin ${{ github.base_ref }}
          pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
