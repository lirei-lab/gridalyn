name: Publish documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Jobs run on `sti-k8s`, a self-hosted Actions Runner Controller scale set on
# the UQTR STI Kubernetes cluster, registered at the organisation level
# (github.com/lirei-lab) with minRunners 0 and maxRunners 4. Scale-from-zero
# means the first job of a run waits for a pod to start; that is expected, not
# a hang.
#
# TO GO BACK TO GITHUB-HOSTED RUNNERS, replace `sti-k8s` with `ubuntu-latest`
# below -- nothing else in these workflows depends on the runner. Worth knowing
# before debugging a stuck run: with no matching runner online, a job queues
# silently instead of failing, so "nothing is happening" is the symptom of a
# label that matches nothing.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: sti-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,docs]"

      - name: Build MkDocs site
        run: mkdocs build --strict -f docs/mkdocs.yml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: sti-k8s
    # Bounded well above the step timeout below so a genuine hang still ends,
    # rather than occupying a runner for the 6 h default.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Widened from the action's 600000 ms default, and kept only as a
          # margin -- NOT because this deployment is slow.
          #
          # The history, because the first version of this comment drew the
          # wrong conclusion from it. On 2026-08-06 four consecutive
          # deployments of 35c6cd6b each sat in `deployment_in_progress` for
          # exactly ten minutes, hit the default, cancelled and reported
          # failure -- while the content went live regardless. That much was
          # right: the publish succeeded and only the status poll gave up. What
          # was wrong was inferring that this repository's Pages deployments
          # routinely need more than ten minutes, and that widening the window
          # was therefore the fix.
          #
          # Measured on 2026-08-07, the first deployment after the platform
          # recovered: build 2m56s, DEPLOY 11 SECONDS. The ten-minute stalls
          # were a transient platform condition -- GitHub declared a major
          # Actions and Pages outage hours later -- not a property of this
          # repository. This setting did not fix anything; the outage ending
          # did.
          #
          # It stays because a margin costs nothing. But read it as a margin:
          # a deployment that burns twenty minutes is a real failure to
          # investigate, not a number to raise again.
          timeout: 1200000
