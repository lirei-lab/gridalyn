name: Publish documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,docs]"

      - name: Build MkDocs site
        run: mkdocs build --strict -f docs/mkdocs.yml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Bounded well above the step timeout below so a genuine hang still ends,
    # rather than occupying a runner for the 6 h default.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action's default timeout is 600000 ms. Four consecutive
          # deployments of 35c6cd6b (2026-08-06 12:59, 13:10, 13:36, 14:48)
          # each sat in `deployment_in_progress` for exactly ten minutes, hit
          # that default, cancelled the deployment and reported failure -- yet
          # the content went live: the audit amendment added by 1118312e is
          # served at lirei.ca/gridalyn today. The publish succeeds; only the
          # status poll gives up too early, so the red was false and the docs
          # were never stale. Widening the observation window is the fix for
          # that; it does not paper over a failed publish, because there was
          # none. If a future deployment burns all 20 minutes, that IS a real
          # failure and should be investigated rather than widened again.
          timeout: 1200000
